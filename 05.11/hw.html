<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивная карточка студента — Гарри Поттер</title>
    <link rel="stylesheet" href="hw.css">
</head>
<body>
    <div class="card" id="studentCard">
        <img id="photo" src="гарии.webp" alt="Гарри Поттер">
        <h2 id="name">Гарри Джеймс Поттер</h2>
        <p><strong>Специальность:</strong> <span id="specialty">Боевая магия</span></p>
        <p><strong>Курс:</strong> <span id="course">3</span></p>
        <p><strong>Факультет:</strong> <span id="faculty">Гриффиндор</span></p>
        
        <h3>Дисциплины:</h3>
        <ul id="subjects">
            <li>Зельеварение</li>
            <li>Трансфигурация</li>
            <li>Защита от тёмных искусств</li>
            <li>Травология</li>
            <li>Заклинания</li>
            <li>Астрономия</li>
        </ul>

        <button id="editBtn">Изменить информацию</button>
        <button id="hideBtn">Скрыть карточку</button>
    </div>

    <button id="showBtn">Показать карточку</button>

    <script src="hw.js"></script>
</body>
</html>
